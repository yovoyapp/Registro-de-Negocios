window.storage = {
  async get(key) {
    const v = localStorage.getItem("miruta:" + key);
    if (v === null) {
      throw new Error("not found: " + key);
    }
    return {
      key,
      value: v
    };
  },
  async set(key, value) {
    localStorage.setItem("miruta:" + key, value);
    return {
      key,
      value
    };
  },
  async delete(key) {
    localStorage.removeItem("miruta:" + key);
    return {
      key,
      deleted: true
    };
  },
  async list(prefix) {
    const p = "miruta:" + (prefix || "");
    const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice(7));
    return {
      keys
    };
  }
};
